name: "Build And Release"

on:
  push:
    branches:
      - release*
    paths-ignore:
      - "_script/**"
      - "doc/**"
      - "**/*.md"
      - "**/.gitignore"
      - "**/LICENSE"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      NPM_CONFIG_NODE_LINKER: "hoisted"
      NPM_CONFIG_SHAMEFULLY_HOIST: "true"
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows
          - ubuntu
          - macos
        node:
          - 22
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4.1.7
        with:
          submodules: true
          fetch-depth: 0

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://npm.pkg.github.com/

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Get package info"
        id: package-info
        uses: luizfelipelaviola/get-package-info@v1
        with:
          path: ./packages/gui

      - name: "Set C++17 flags"
        if: ${{ matrix.os != 'windows' }}
        run: |
          echo "CXXFLAGS=-std=c++17" >> $GITHUB_ENV
          echo "CFLAGS=-std=c++17" >> $GITHUB_ENV

      - name: "Clean workspace"
        run: |
          node -e "const fs=require('fs'); ['node_modules','packages/gui/node_modules','packages/core/node_modules','packages/mitmproxy/node_modules','pnpm-lock.yaml'].forEach(d=>{try{fs.rmSync(d,{recursive:true,force:true})}catch(e){}});"

      - name: "Create .npmrc for hoisted deps"
        run: |
          echo "node-linker=hoisted" > .npmrc
          echo "shamefully-hoist=true" >> .npmrc
          cd packages/gui
          echo "node-linker=hoisted" > .npmrc
          echo "shamefully-hoist=true" >> .npmrc
          cd ../..

      - name: "Install dependencies"
        run: pnpm install --no-frozen-lockfile

      - name: "Install bsdtar for Linux pacman"
        if: ${{ matrix.os == 'ubuntu' }}
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: "Force resolve cross-spawn"
        run: |
          node -e "
          const fs=require('fs'),path=require('path'),{execSync}=require('child_process');
          function find(d,t){try{let f=fs.readdirSync(d);if(f.includes(t))return path.join(d,t);for(let x of f){let p=path.join(d,x);if(fs.statSync(p).isDirectory()&&!p.includes('.pnpm')){let r=find(p,t);if(r)return r}}}catch(e){}return null}
          let t=find('.','cross-spawn');
          if(t){console.log('Found:',t);fs.mkdirSync('packages/gui/node_modules',{recursive:true});fs.cpSync(t,'packages/gui/node_modules/cross-spawn',{recursive:true})}
          else{execSync('npm install cross-spawn --no-save --legacy-peer-deps',{cwd:'packages/gui',stdio:'inherit'})}
          "

      - name: "Build (Windows/macOS)"
        if: ${{ matrix.os != 'ubuntu' }}
        env:
          VUE_APP_PUBLISH_URL: https://github.com/dyr1980/dev-sidecar/releases/download/v${{ steps.package-info.outputs.version }}
        run: |
          cd packages/gui
          npm run electron:build

      - name: "Build (Linux)"
        if: ${{ matrix.os == 'ubuntu' }}
        env:
          VUE_APP_PUBLISH_URL: https://github.com/dyr1980/dev-sidecar/releases/download/v${{ steps.package-info.outputs.version }}
        run: |
          cd packages/gui
          dbus-run-session -- npm run electron:build

      - name: "Rename Linux pacman (x86_64 -> x64 fallback)"
        if: ${{ matrix.os == 'ubuntu' }}
        run: |
          cd packages/gui/dist_electron
          mv DevSidecar-${{ steps.package-info.outputs.version }}-x86_64.pkg.tar.xz DevSidecar-${{ steps.package-info.outputs.version }}-x64.pkg.tar.xz 2>/dev/null || true

      - name: "Upload all artifacts"
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{ matrix.os }}-build
          path: packages/gui/dist_electron/
          if-no-files-found: warn

  download-and-release:
    runs-on: ubuntu-latest
    needs: build-and-upload
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4.1.7

      - name: "Get package info"
        id: package-info
        uses: luizfelipelaviola/get-package-info@v1
        with:
          path: ./packages/gui

      - name: "Make release dir"
        run: mkdir release

      - name: "Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: "Print files"
        run: ls -lah release

      - name: "Create draft release"
        uses: wangliang181230/github-action-ghr@master
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHR_PATH: release/
          GHR_TITLE: ${{ github.ref_name }}
          GHR_REPLACE: true
          GHR_DRAFT: true
