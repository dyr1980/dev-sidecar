name: "Build And Release"

on:
  push:
    branches:
      - release*
    tags:
      - 'v*'
    paths-ignore:
      - "_script/**"
      - "doc/**"
      - "**/*.md"
      - "**/.gitignore"
      - "**/LICENSE"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ${{ contains(matrix.os, '-arm') && matrix.os || format('{0}-latest', matrix.os) }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      VUE_APP_PUBLISH_PROVIDER: generic
      NPM_CONFIG_NODE_LINKER: "hoisted"
      NPM_CONFIG_SHAMEFULLY_HOIST: "true"
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows
          - ubuntu
          - macos
        node:
          - 22
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4.1.7
        with:
          submodules: true
          fetch-depth: 0

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4

      - name: 'Setup Node.js "${{ matrix.node }}.x" environment'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://npm.pkg.github.com/

      - name: "Setup Python environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Get package info"
        id: package-info
        uses: luizfelipelaviola/get-package-info@v1
        with:
          path: ./packages/gui

      - name: "Print version"
        run: echo "version = ${{ steps.package-info.outputs.version }}";

      - name: "Setup electron caches"
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-v2-

      - name: "Set C++17 compiler flags"
        if: ${{ matrix.os != 'windows' }}
        run: |
          echo "CXXFLAGS=-std=c++17" >> $GITHUB_ENV
          echo "CFLAGS=-std=c11" >> $GITHUB_ENV

      - name: "Force clean node_modules & lockfile"
        run: |
          node -e "const fs=require('fs'); ['node_modules','packages/gui/node_modules','packages/core/node_modules','packages/mitmproxy/node_modules','pnpm-lock.yaml'].forEach(d=>{try{fs.rmSync(d,{recursive:true,force:true})}catch(e){}});"

      - name: "Create .npmrc for hoisted dependencies"
        run: |
          echo "node-linker=hoisted" > .npmrc
          echo "shamefully-hoist=true" >> .npmrc
          echo "enable-pre-post-scripts=true" >> .npmrc
          
          cd packages/gui
          echo "node-linker=hoisted" > .npmrc
          echo "shamefully-hoist=true" >> .npmrc
          echo "enable-pre-post-scripts=true" >> .npmrc
          cd ../..

      - name: "'pnpm install'"
        run: |
          pnpm install --no-frozen-lockfile;

      - name: "Force resolve cross-spawn for electron-builder (Node.js)"
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          function findDir(startDir, targetDirName) {
            try {
              const files = fs.readdirSync(startDir);
              if (files.includes(targetDirName)) return path.join(startDir, targetDirName);
              for (const file of files) {
                const fullPath = path.join(startDir, file);
                if (fs.statSync(fullPath).isDirectory() && !fullPath.includes('.pnpm')) {
                  const found = findDir(fullPath, targetDirName);
                  if (found) return found;
                }
              }
            } catch (e) {}
            return null;
          }

          const target = findDir('.', 'cross-spawn');
          if (target) {
            console.log('Found cross-spawn at:', target);
            fs.mkdirSync('packages/gui/node_modules', { recursive: true });
            fs.cpSync(target, 'packages/gui/node_modules/cross-spawn', { recursive: true });
          } else {
            console.log('cross-spawn not found, forcing npm install...');
            try {
              execSync('npm install cross-spawn --no-save --legacy-peer-deps', { cwd: 'packages/gui', stdio: 'inherit' });
            } catch (e) {
              console.error('Failed to install cross-spawn', e);
              process.exit(1);
            }
          }
          "

      - name: "Install bsdtar for Linux pacman package"
        if: ${{ matrix.os == 'ubuntu' }}
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: "npm run electron:build (Windows/macOS)"
        if: ${{ matrix.os != 'ubuntu' }}
        env:
          VUE_APP_PUBLISH_URL: https://github.com/dyr1980/dev-sidecar/releases/download/v${{ steps.package-info.outputs.version }}
        run: |
          cd packages/gui;
          npm run electron:build;

      - name: "npm run electron:build (Linux)"
        if: ${{ matrix.os == 'ubuntu' }}
        env:
          DEBUG: "@malept/flatpak-bundler"
          VUE_APP_PUBLISH_URL: https://github.com/dyr1980/dev-sidecar/releases/download/v${{ steps.package-info.outputs.version }}
        run: |
          cd packages/gui;
          dbus-run-session -- npm run electron:build;

      # Rename artifacts - Windows
      - name: "Rename artifacts - Windows"
        if: ${{ matrix.os == 'windows' }}
        run: |
          cd packages/gui/dist_electron;
          ren DevSidecar-${{ steps.package-info.outputs.version }}-x64.exe   DevSidecar-${{ steps.package-info.outputs.version }}-windows-x86_64.exe;
          ren DevSidecar-${{ steps.package-info.outputs.version }}-ia32.exe  DevSidecar-${{ steps.package-info.outputs.version }}-windows-ia32.exe;
          ren DevSidecar-${{ steps.package-info.outputs.version }}-arm64.exe DevSidecar-${{ steps.package-info.outputs.version }}-windows-arm64.exe;

      # Rename artifacts - Linux
      - name: "Rename artifacts - Linux"
        if: ${{ matrix.os == 'ubuntu' }}
        run: |
          cd packages/gui/dist_electron;
          # 先尝试用新版的名字重命名，如果没有则回退到旧版名字
          mv DevSidecar-${{ steps.package-info.outputs.version }}-amd64.deb       DevSidecar-${{ steps.package-info.outputs.version }}-linux-x86_64.deb;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-x86_64.AppImage DevSidecar-${{ steps.package-info.outputs.version }}-linux-x86_64.AppImage;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-x64.tar.gz      DevSidecar-${{ steps.package-info.outputs.version }}-linux-x86_64.tar.gz;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-x86_64.rpm      DevSidecar-${{ steps.package-info.outputs.version }}-linux-x86_64.rpm;
          # 关键修改：尝试 x86_64 和 x64 两种可能的 pacman 包名
          mv DevSidecar-${{ steps.package-info.outputs.version }}-x86_64.pkg.tar.xz DevSidecar-${{ steps.package-info.outputs.version }}-linux-x86_64.pkg.tar.xz 2>/dev/null || mv DevSidecar-${{ steps.package-info.outputs.version }}-x64.pkg.tar.xz DevSidecar-${{ steps.package-info.outputs.version }}-linux-x86_64.pkg.tar.xz;
          
          mv DevSidecar-${{ steps.package-info.outputs.version }}-arm64.deb       DevSidecar-${{ steps.package-info.outputs.version }}-linux-arm64.deb;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-arm64.AppImage  DevSidecar-${{ steps.package-info.outputs.version }}-linux-arm64.AppImage;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-arm64.tar.gz    DevSidecar-${{ steps.package-info.outputs.version }}-linux-arm64.tar.gz;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-aarch64.rpm      DevSidecar-${{ steps.package-info.outputs.version }}-linux-arm64.rpm;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-arm64.pkg.tar.xz DevSidecar-${{ steps.package-info.outputs.version }}-linux-arm64.pkg.tar.xz;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-armv7l.deb      DevSidecar-${{ steps.package-info.outputs.version }}-linux-armv7l.deb;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-armv7l.AppImage DevSidecar-${{ steps.package-info.outputs.version }}-linux-armv7l.AppImage;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-armv7l.tar.gz   DevSidecar-${{ steps.package-info.outputs.version }}-linux-armv7l.tar.gz;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-armv7l.rpm      DevSidecar-${{ steps.package-info.outputs.version }}-linux-armv7l.rpm;

      # Rename artifacts - macOS
      - name: "Rename artifacts - macOS"
        if: ${{ matrix.os == 'macos' }}
        run: |
          cd packages/gui/dist_electron;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-x64.dmg        DevSidecar-${{ steps.package-info.outputs.version }}-macos-x86_64.dmg;
          mv DevSidecar-${{ steps.package-info.outputs.version }}-arm64.dmg      DevSidecar-${{ steps.package-info.outputs.version }}-macos-arm64.dmg;

      # Upload Artifacts
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4.4.0
        with:
          path: packages/gui/dist_electron/DevSidecar-*
          name: "DevSidecar-${{ matrix.os }}-${{ steps.package-info.outputs.version }}"
          if-no-files-found: warn

  download-and-release:
    runs-on: ubuntu-latest
    needs: build-and-upload
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4.1.7

      - name: "Get package info"
        id: package-info
        uses: luizfelipelaviola/get-package-info@v1
        with:
          path: ./packages/gui

      - name: 'Make release dir'
        run: mkdir release

      - name: "Download all artifacts"
        uses: actions/download-artifact@v4.1.8
        with:
          path: release
          merge-multiple: true

      - name: 'Print files'
        run: ls -lah release;

      - name: "Create a draft release"
        uses: wangliang181230/github-action-ghr@master
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHR_PATH: release/
          GHR_TITLE: ${{ github.ref_name }}
          GHR_REPLACE: true
          GHR_DRAFT: true
